<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fashion Reels — Media Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0e0e;
    --card: #121212;
    --accent: #ff5b1f;
    --accent-2: #ff8a3d;
    --font-display: 'Bricolage Grotesque', sans-serif;
    --font-body: 'Manrope', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); overflow-x:hidden; }

  /* ============ FULL-PAGE PARALLAX REEL WALL ============ */
  .parallax-page{
    position: relative;
    height: 420vh;          /* whole page IS this scrolling section */
    overflow: hidden;
    background: var(--bg);
  }
  .columns-wrap{
    position:absolute; top:0; left:0; right:0;
    display:flex; gap: 14px;
    padding: 0 14px;
  }
  .col{
    flex:1;
    display:flex; flex-direction:column; gap:14px;
    will-change: transform;
  }
  .reel-thumb{
    position:relative; width:100%; aspect-ratio: 9/13; border-radius:16px; overflow:hidden;
    background: var(--card); flex-shrink:0;
  }
  .reel-thumb .screen{ position:absolute; inset:0; background-size:200% 200%; }
  .rg1{ background-image: linear-gradient(135deg,#ff5b1f,#7a2bff 65%,#241041); }
  .rg2{ background-image: linear-gradient(135deg,#ff8a3d,#ff2f6e 65%,#3d0a24); }
  .rg3{ background-image: linear-gradient(135deg,#ffd23d,#ff5b1f 65%,#3d1c05); }
  .rg4{ background-image: linear-gradient(135deg,#ff9d3d,#c23dff 65%,#28083d); }

  /* fixed text overlay — visible on load, fades as user scrolls */
  .hero-overlay{
    position: fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center;
    padding: 24px;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 40%, rgba(0,0,0,.6) 100%);
    z-index: 5;
  }
  .crumb{
    color: rgba(255,255,255,.75); font-size:13px; font-weight:600; margin-bottom:18px;
    display:flex; gap:6px; align-items:center;
  }
  .crumb a{ color:inherit; text-decoration:none; }
  .crumb a:hover{ color:#fff; }
  .cat-swatch{ width:9px; height:9px; border-radius:3px; background:var(--accent); display:inline-block; margin-right:8px; }

  .hero-overlay h1{
    font-family: var(--font-display); font-weight:800; color:#fff;
    font-size: clamp(40px, 7vw, 84px); letter-spacing:-.02em; margin: 0 0 14px;
  }
  .hero-overlay p{
    color: rgba(255,255,255,.8); max-width:480px; font-size:15px; line-height:1.6; margin: 0 0 22px;
  }
  .hero-meta{ display:flex; gap:22px; font-size:13.5px; color:rgba(255,255,255,.85); font-weight:600; }
  .hero-meta span{ display:flex; align-items:center; gap:6px; }
  .hero-meta .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent-2); }

  .scroll-cue{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.7); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .scroll-cue .line{ width:1px; height:26px; background: rgba(255,255,255,.4); animation: cueMove 1.6s ease-in-out infinite; }
  @keyframes cueMove{ 0%,100%{ transform: scaleY(.4); opacity:.4;} 50%{ transform: scaleY(1); opacity:1;} }

  @media (max-width: 560px){ .columns-wrap .col:nth-child(4){ display:none; } }
  @media (prefers-reduced-motion: reduce){ .col{ transform:none !important; } .scroll-cue .line{ animation:none; } .hero-overlay{ position:absolute; } }
</style>
</head>
<body>

<section class="parallax-page" id="parallaxPage">
  <div class="columns-wrap" id="columnsWrap"></div>

  <div class="hero-overlay" id="heroOverlay">
    <div class="crumb"><a href="/">Home</a>&nbsp;/&nbsp;<a href="/reels">Reels</a>&nbsp;/&nbsp;<span style="color:#fff">Fashion</span></div>
    <h1><span class="cat-swatch"></span>Fashion Reels</h1>
    <p>Style edits, outfit reveals and trend breakdowns — the sharpest fashion reels, updated daily.</p>
    <div class="hero-meta">
      <span><span class="dot"></span>102 reels</span>
      <span><span class="dot"></span>Updated today</span>
      <span><span class="dot"></span>18 creators</span>
    </div>
    <div class="scroll-cue"><span class="line"></span>Scroll</div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  gsap.registerPlugin(ScrollTrigger);

  /* ---------- build parallax columns (enough content to fill the tall page) ---------- */
  const wrap = document.getElementById('columnsWrap');
  const grads = ['rg1','rg2','rg3','rg4'];
  const NUM_COLS = 4;
  const ITEMS_PER_COL = 22;
  const colSpeeds = [-420, 260, -320, 460]; // px travel per column, alternating direction

  for (let c = 0; c < NUM_COLS; c++){
    const col = document.createElement('div');
    col.className = 'col';
    col.style.marginTop = (c % 2 === 0 ? '-80px' : '60px');
    for (let i = 0; i < ITEMS_PER_COL; i++){
      const g = grads[(c + i) % grads.length];
      const thumb = document.createElement('div');
      thumb.className = 'reel-thumb';
      thumb.innerHTML = `<div class="screen ${g}"></div>`;
      col.appendChild(thumb);
    }
    wrap.appendChild(col);
  }

  if (!reduceMotion){
    const cols = Array.from(wrap.children);
    cols.forEach((col, i) => {
      gsap.to(col, {
        y: colSpeeds[i % colSpeeds.length],
        ease: 'none',
        scrollTrigger: {
          trigger: '#parallaxPage',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 0.6
        }
      });
    });

    /* text overlay: visible on load, fades out on scroll */
    gsap.to('#heroOverlay', {
      opacity: 0,
      y: -40,
      ease: 'none',
      scrollTrigger: {
        trigger: '#parallaxPage',
        start: 'top top',
        end: '28% top',
        scrub: 0.6
      },
      onComplete: () => { document.getElementById('heroOverlay').style.pointerEvents = 'none'; }
    });
  }
})();
</script>
</body>
</html>
