<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUNR Podcast — Conversations that inspire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3EEE6;
    --ink:#171412;
    --black:#0B0A09;
    --orange:#FF5A1F;
    --orange-soft:#FF7A45;
    --line:rgba(255,255,255,0.14);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:#e9e4da;
    font-family:'Manrope', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .banner{
    position:relative;
    width:100%;
    max-width:1060px;
    height:220px;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    background:var(--cream);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.35);
  }

  /* ============ LEFT SIDE ============ */
  .left{
    position:relative;
    width:38%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 0 0 42px;
    z-index:3;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--orange);
    font-weight:800;
    font-size:12px;
    letter-spacing:0.14em;
    margin-bottom:10px;
    opacity:0;
  }

  .eyebrow svg{ display:block; }

  .headline{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:34px;
    line-height:1.08;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .headline .line{ overflow:hidden; display:block; }
  .headline .line span{ display:inline-block; transform:translateY(110%); }
  .headline .accent{ color:var(--orange); font-style:italic; font-weight:600; }

  .rule{
    width:34px;
    height:2px;
    background:var(--orange);
    margin:14px 0 12px;
    transform-origin:left;
    transform:scaleX(0);
  }

  .sub{
    font-size:13px;
    color:#5c574f;
    font-weight:500;
    line-height:1.5;
    opacity:0;
  }
  .sub b{ color:var(--ink); font-weight:700; }
  .sub .yt{ color:var(--orange); font-weight:800; }

  /* ============ CENTER PLAY BUTTON ============ */
  .play-wrap{
    position:absolute;
    left:38%;
    top:50%;
    transform:translate(-50%,-50%);
    width:118px;
    height:118px;
    z-index:5;
  }

  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px dashed var(--orange);
    opacity:0.9;
  }

  .ring-dot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--orange);
    top:-3px;
    left:50%;
    margin-left:-3px;
  }

  .play-btn{
    position:absolute;
    inset:12px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #262523, #050505 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 24px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
    cursor:pointer;
  }

  .play-icon{
    width:34px;
    height:24px;
    border-radius:6px;
    background:#E1261C;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(225,38,28,0.5);
  }
  .play-icon::before{
    content:"";
    width:0; height:0;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:11px solid #fff;
    margin-left:3px;
  }

  /* ============ RIGHT SIDE ============ */
  .right{
    position:relative;
    flex:1;
    background:var(--black);
    clip-path:polygon(14% 0, 100% 0, 100% 100%, 0% 100%);
    display:flex;
    align-items:center;
    padding-left:9%;
    z-index:2;
  }

  .waveform{
    display:flex;
    align-items:center;
    gap:3px;
    height:44px;
    margin-right:34px;
    flex-shrink:0;
  }
  .waveform span{
    display:block;
    width:2.5px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--orange-soft), var(--orange));
    transform:scaleY(0.15);
    transform-origin:center;
  }

  .stats{
    display:flex;
    align-items:center;
    gap:22px;
    color:#fff;
    flex-shrink:0;
  }
  .stat{
    text-align:center;
    opacity:0;
    transform:translateY(14px);
  }
  .stat svg{ margin:0 auto 4px; display:block; opacity:0.85; }
  .stat .num{ font-size:16px; font-weight:800; line-height:1; }
  .stat .lbl{ font-size:9.5px; color:#9c968c; font-weight:600; letter-spacing:0.03em; margin-top:2px; }
  .divider{ width:1px; height:30px; background:var(--line); }

  .cta-wrap{ margin-left:26px; flex-shrink:0; }
  .cta{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 20px;
    border:1.5px solid var(--orange);
    border-radius:999px;
    color:#fff;
    font-weight:700;
    font-size:12.5px;
    white-space:nowrap;
    background:transparent;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    opacity:0;
    transform:translateY(14px);
  }
  .cta .yt-ic{
    width:18px; height:14px;
    background:#fff;
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .cta .yt-ic::before{
    content:"";
    width:0;height:0;
    border-top:4.5px solid transparent;
    border-bottom:4.5px solid transparent;
    border-left:7px solid #E1261C;
    margin-left:1.5px;
  }
  .cta .arrow{ margin-left:4px; transition:transform .3s ease; }
  .cta:hover .arrow{ transform:translateX(4px); }
  .cta-fill{
    position:absolute; inset:0;
    background:var(--orange);
    transform:scaleX(0);
    transform-origin:left;
    z-index:-1;
    transition:transform .35s ease;
  }
  .cta:hover .cta-fill{ transform:scaleX(1); }

  .grow-text{
    position:absolute;
    right:26px;
    top:18px;
    font-family:'Fraunces', serif;
    font-style:italic;
    color:#fff;
    font-size:13px;
    line-height:1.2;
    text-align:right;
    opacity:0;
  }
  .grow-text u{
    text-decoration-color:var(--orange);
    text-decoration-thickness:2px;
  }
  .grow-arrow{
    position:absolute;
    right:70px;
    top:52px;
    opacity:0;
  }

  @media (max-width:760px){
    .banner{ height:auto; flex-direction:column; }
    .left{ width:100%; padding:26px 24px 20px; }
    .play-wrap{ position:relative; left:auto; top:auto; transform:none; margin:0 auto 10px; }
    .right{ clip-path:none; flex-direction:column; padding:22px 24px 26px; gap:16px; }
    .waveform{ display:none; }
    .grow-text, .grow-arrow{ display:none; }
    .headline{ font-size:26px; text-align:center;}
    .eyebrow, .sub{ justify-content:center; text-align:center; }
    .left{ align-items:center; text-align:center; }
  }

  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="banner" id="banner">
  <div class="left">
    <div class="eyebrow" id="eyebrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M6 6v12M18 6v12M2 10v4M22 10v4" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round"/></svg>
      RUNR PODCAST
    </div>
    <h1 class="headline">
      <span class="line"><span>Conversations</span></span>
      <span class="line"><span>that <em class="accent">inspire.</em></span></span>
    </h1>
    <div class="rule" id="rule"></div>
    <p class="sub" id="sub">Stories that stay with you.<br><b>Only on <span class="yt">YouTube</span>.</b></p>
  </div>

  <div class="play-wrap" id="playWrap">
    <div class="ring" id="ring"><div class="ring-dot"></div></div>
    <div class="play-btn" id="playBtn"><div class="play-icon"></div></div>
  </div>

  <div class="right">
    <div class="waveform" id="waveform"></div>

    <div class="stats">
      <div class="stat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="#fff" stroke-width="2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="num">10K+</div><div class="lbl">Subscribers</div>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <svg width="14" height="16" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="#fff" stroke-width="2"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="num">500+</div><div class="lbl">Episodes</div>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="#fff" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="#fff" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="#fff" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="#fff" stroke-width="2"/></svg>
        <div class="num">5</div><div class="lbl">Categories</div>
      </div>
    </div>

    <div class="cta-wrap">
      <button class="cta" id="cta">
        <span class="cta-fill"></span>
        <span class="yt-ic"></span> Subscribe on YouTube
        <span class="arrow">→</span>
      </button>
    </div>

    <div class="grow-text" id="growText">Let's grow<br><u>together!</u></div>
    <svg class="grow-arrow" id="growArrow" width="46" height="30" viewBox="0 0 46 30" fill="none">
      <path d="M2 4C16 2 34 10 40 24" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
      <path d="M34 22L40 24L37 18" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // build waveform bars
  const wf = document.getElementById('waveform');
  const heights = [8,14,22,34,44,30,18,26,40,44,28,16,10,20,32,44,26,14,8,18,30,38,22,12];
  heights.forEach(h=>{
    const bar = document.createElement('span');
    bar.style.height = h+'px';
    wf.appendChild(bar);
  });

  window.addEventListener('load', () => {
    const tl = gsap.timeline({ defaults:{ ease:'power3.out' } });

    tl.from('#banner', { opacity:0, scale:0.97, duration:0.6, ease:'power2.out' })
      .to('.headline .line span', { y:'0%', duration:0.8, stagger:0.12 }, 0.15)
      .to('#eyebrow', { opacity:1, duration:0.5 }, 0.1)
      .fromTo('#playWrap', { scale:0, opacity:0 }, { scale:1, opacity:1, duration:0.7, ease:'back.out(1.8)' }, 0.25)
      .to('#rule', { scaleX:1, duration:0.5 }, 0.55)
      .to('#sub', { opacity:1, y:0, duration:0.5 }, 0.65)
      .to('.waveform span', { scaleY:1, duration:0.5, stagger:0.02, ease:'elastic.out(1,0.6)' }, 0.5)
      .to('.stat', { opacity:1, y:0, duration:0.5, stagger:0.1 }, 0.75)
      .to('#cta', { opacity:1, y:0, duration:0.5 }, 1.0)
      .to('#growText', { opacity:1, duration:0.5 }, 1.15)
      .to('#growArrow', { opacity:1, duration:0.5 }, 1.25);

    // continuous ambient loops
    gsap.to('#ring', { rotation:360, duration:14, repeat:-1, ease:'none', transformOrigin:'50% 50%' });

    gsap.to('.waveform span', {
      scaleY: () => gsap.utils.random(0.3,1),
      duration: 0.6,
      repeat:-1,
      yoyo:true,
      stagger:{ each:0.08, repeat:-1, yoyo:true }
    });

    gsap.to('#playBtn', {
      boxShadow:'0 14px 34px rgba(255,90,31,0.35), inset 0 0 0 1px rgba(255,255,255,0.08)',
      duration:1.4,
      repeat:-1,
      yoyo:true,
      ease:'sine.inOut'
    });

    // hover interactions
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('mouseenter', ()=> gsap.to(playBtn,{ scale:1.08, duration:0.3, ease:'power2.out'}));
    playBtn.addEventListener('mouseleave', ()=> gsap.to(playBtn,{ scale:1, duration:0.3, ease:'power2.out'}));
  });
</script>
</body>
</html>
